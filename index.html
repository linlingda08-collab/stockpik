<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockMemo - 必要品・ストック管理</title>

    <!-- iPhone ホーム画面アイコン & アプリ設定 -->
    <link rel="apple-touch-icon" href="icon.PNG">
    <meta name="apple-mobile-web-app-title" content="StockMemo">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EXIFデータ（撮影日時など）読み取り用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>

    <style>
        /* iPhoneのSafari等でカレンダー(input type="date")が枠からはみ出す現象の対策 */
        input[type="date"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            min-height: 2.6rem;
            box-sizing: border-box;
        }
        /* 円形カラーピッカーのスタイル調整 */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #e2e8f0;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 selection:bg-indigo-100">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="icon.PNG" id="headerIcon" class="w-9 h-9 rounded-xl object-cover shadow-sm border border-slate-100" onerror="this.style.display='none'; document.getElementById('headerIconFallback').style.display='flex';">
                <div id="headerIconFallback" class="hidden bg-indigo-600 text-white w-9 h-9 rounded-xl items-center justify-center shadow-md">
                    <i class="fa-solid fa-box-archive text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">StockMemo</h1>
                    <p class="text-[10px] text-slate-400">必要品・買い物時期メモ</p>
                </div>
            </div>
            <!-- ジャンル編集 ＆ 必要品追加ボタン -->
            <div class="flex items-center space-x-2">
                <button onclick="openGenreManageModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1 border border-slate-200">
                    <i class="fa-solid fa-tags text-indigo-600"></i>
                    <span class="hidden sm:inline">ジャンル編集</span>
                    <span class="sm:hidden">ジャンル</span>
                </button>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-md transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="text-xs sm:text-sm">追加</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-4">
        <!-- 次の給料日インフォメーション -->
        <div class="bg-gradient-to-r from-indigo-500 to-indigo-700 text-white p-3.5 rounded-2xl shadow-sm mb-4 flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calendar-check text-base text-indigo-200"></i>
                <div>
                    <span class="font-semibold block">次回給料日 (26日ルール)</span>
                    <span id="paydayNotice" class="text-indigo-100 text-[11px]">計算中...</span>
                </div>
            </div>
            <span class="bg-white/20 px-2.5 py-1 rounded-lg font-bold backdrop-blur-sm">26日営業日設定</span>
        </div>

        <!-- 検索・ジャンルフィルター -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-4 space-y-3">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="品名やメモ、購入先で検索..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- カテゴリ（ジャンル）タブ一覧 -->
            <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1">
                <div id="categoryTabs" class="flex flex-nowrap sm:flex-wrap gap-1.5 shrink-0">
                    <!-- 動的生成 -->
                </div>
            </div>
        </div>

        <!-- リスト表示エリア -->
        <div id="itemsContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- 動的生成 -->
        </div>

        <!-- 該当なし表示 -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-4xl mb-3">📭</div>
            <p class="text-slate-500 text-sm">必要品がまだありません。<br>右上から追加してみましょう！</p>
        </div>
    </main>

    <!-- 下部固定カテゴリーナビゲーション（いそぎ / 給料日まで / まだ先） -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-40 px-2 py-1.5 shadow-lg">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
            <button onclick="setTimingFilter('all')" id="nav-all" class="flex flex-col items-center py-1 rounded-xl transition text-indigo-600 bg-indigo-50">
                <i class="fa-solid fa-list text-base mb-0.5"></i>
                <span class="text-[10px] font-bold">すべて</span>
            </button>
            <button onclick="setTimingFilter('urgent')" id="nav-urgent" class="flex flex-col items-center py-1 rounded-xl transition text-slate-500 hover:text-rose-600">
                <i class="fa-solid fa-fire text-base mb-0.5"></i>
                <span class="text-[10px] font-bold">🔥 いそぎ</span>
            </button>
            <button onclick="setTimingFilter('payday')" id="nav-payday" class="flex flex-col items-center py-1 rounded-xl transition text-slate-500 hover:text-amber-600">
                <i class="fa-solid fa-wallet text-base mb-0.5"></i>
                <span class="text-[10px] font-bold">📅 給料日まで</span>
            </button>
            <button onclick="setTimingFilter('later')" id="nav-later" class="flex flex-col items-center py-1 rounded-xl transition text-slate-500 hover:text-emerald-600">
                <i class="fa-solid fa-hourglass-half text-base mb-0.5"></i>
                <span class="text-[10px] font-bold">⏳ まだ先</span>
            </button>
        </div>
    </nav>

    <!-- アイテム追加・編集モーダル -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-xl p-5 sm:p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modalTitle" class="text-lg font-bold text-slate-900">必要品を追加</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">

                <!-- STEP 1: 写真を最初に選択 -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
                    <label class="block text-xs font-bold text-slate-700">
                        <i class="fa-solid fa-camera text-indigo-600 mr-1"></i> ① 写真を選択（任意）
                    </label>
                    <input type="file" id="itemImageFile" accept="image/*" onchange="handleImagePreview(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    <input type="hidden" id="itemImageBase64">
                    
                    <div id="imagePreviewContainer" class="mt-2 hidden flex items-center space-x-3">
                        <img id="imagePreview" class="w-16 h-16 object-cover rounded-xl border border-slate-200 shadow-sm shrink-0">
                        <div id="exifInfo" class="text-[11px] text-slate-500"></div>
                    </div>
                </div>

                <!-- STEP 2: タイトル等の詳細を入力 -->
                <div class="space-y-3 pt-1">
                    <p class="text-xs font-bold text-slate-700"><i class="fa-solid fa-pen-to-square text-indigo-600 mr-1"></i> ② 詳細を入力</p>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">タイトル（商品名など） <span class="text-rose-500">*</span></label>
                        <input type="text" id="itemTitle" required placeholder="例: 柔軟剤 詰め替え 1000ml" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ジャンル <span class="text-rose-500">*</span></label>
                            <select id="itemCategory" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- 動的生成 -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">購入先</label>
                            <input type="text" id="itemStore" placeholder="例: ドラッグストア" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">価格目安 (円)</label>
                            <input type="number" id="itemPrice" placeholder="例: 480" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-end pb-2">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" id="itemFavorite" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <label for="itemFavorite" class="text-xs font-semibold text-slate-700 select-none">⭐ 定番品マーク</label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                        <textarea id="itemMemo" rows="2" placeholder="サイズや型番、お気に入りポイントなど" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                </div>

                <!-- STEP 3: カレンダーで時期を選択（iPhoneでの枠はみ出し改善対策済み） -->
                <div class="bg-indigo-50/60 p-3.5 rounded-2xl border border-indigo-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-indigo-950">
                            <i class="fa-solid fa-calendar-days text-indigo-600 mr-1"></i> ③ いつまでに欲しいか
                        </label>
                        <button type="button" onclick="setDueDatePending()" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-white px-2 py-0.5 rounded-md border border-indigo-200 shadow-sm">
                            「未定」にする
                        </button>
                    </div>
                    <div class="w-full">
                        <input type="date" id="itemDueDate" class="w-full block px-3 py-2 bg-white border border-indigo-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800">
                    </div>
                    <p id="dueDateNotice" class="text-[11px] text-slate-500">※未定にすると自動的に「⏳ まだ先」に分類されます</p>
                </div>

                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ジャンル管理モーダル -->
    <div id="genreManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-5 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-tags text-indigo-600 mr-1.5"></i>ジャンル編集・追加</h3>
                <button onclick="closeGenreManageModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- 新規ジャンル追加フォーム -->
            <form onsubmit="addNewGenre(event)" class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-3 shrink-0">
                <span class="text-xs font-bold text-slate-700 block">＋ 新しいジャンルを作成</span>
                <div class="flex items-center space-x-2">
                    <input type="color" id="newGenreColor" value="#e0e7ff" title="円をタップして好きな色を選択">
                    <input type="text" id="newGenreName" required placeholder="ジャンル名（例: ペット用品）" class="flex-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="px-3.5 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shrink-0 shadow-sm">追加</button>
                </div>
            </form>

            <!-- 既存ジャンル一覧 ＆ 編集エリア -->
            <div class="overflow-y-auto flex-1 space-y-2 pr-1" id="genreListContainer">
                <!-- 動的生成 -->
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button type="button" onclick="closeGenreManageModal()" class="px-5 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">完了</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        // 26日営業日ルールで「次の給料日」を計算する関数
        function getNextPayday(fromDate = new Date()) {
            let year = fromDate.getFullYear();
            let month = fromDate.getMonth(); // 0~11
            
            function calcPaydayFor(y, m) {
                let target = new Date(y, m, 26);
                let day = target.getDay(); // 0:日, 6:土
                if (day === 6) { // 土曜日 -> 金曜日(25日)
                    target.setDate(25);
                } else if (day === 0) { // 日曜日 -> 金曜日(24日)
                    target.setDate(24);
                }
                return target;
            }

            let currentPayday = calcPaydayFor(year, month);
            let today = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());

            if (today <= currentPayday) {
                return currentPayday;
            } else {
                return calcPaydayFor(year, month + 1);
            }
        }

        // デフォルトジャンル（名前＋HEXカラーコード）
        const defaultGenres = [
            { id: 1, name: '日用品', color: '#e0e7ff' },
            { id: 2, name: '食品', color: '#fef3c7' },
            { id: 3, name: 'コスメ・ケア', color: '#ffe4e6' },
            { id: 4, name: 'その他', color: '#f1f5f9' }
        ];

        // データとカスタムジャンルのロード（永続化保護）
        let customGenres = JSON.parse(localStorage.getItem('stockmemo_genres_v2')) || defaultGenres;
        let items = JSON.parse(localStorage.getItem('stockmemo_items')) || [];

        let currentGenreFilter = 'すべて';
        let currentTimingFilter = 'all'; // all | urgent | payday | later

        function init() {
            renderPaydayInfo();
            renderGenreTabs();
            renderCategorySelect();
            renderApp();
        }

        function renderPaydayInfo() {
            const payday = getNextPayday();
            const y = payday.getFullYear();
            const m = payday.getMonth() + 1;
            const d = payday.getDate();
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = dayNames[payday.getDay()];
            document.getElementById('paydayNotice').innerText = `次回: ${y}年${m}月${d}日 (${dayName})`;
        }

        function renderGenreTabs() {
            const container = document.getElementById('categoryTabs');
            const list = ['すべて', '⭐ 定番', ...customGenres.map(g => g.name)];

            container.innerHTML = list.map(g => {
                const active = currentGenreFilter === g;
                return `<button onclick="setGenreFilter('${g}')" class="px-3 py-1.5 rounded-xl text-xs font-medium transition shrink-0 ${active ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${g}</button>`;
            }).join('');
        }

        function renderCategorySelect() {
            const select = document.getElementById('itemCategory');
            select.innerHTML = customGenres.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
        }

        function setGenreFilter(g) {
            currentGenreFilter = g;
            renderGenreTabs();
            renderApp();
        }

        function setTimingFilter(timing) {
            currentTimingFilter = timing;
            ['all', 'urgent', 'payday', 'later'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (t === timing) {
                    navBtn.className = "flex flex-col items-center py-1 rounded-xl transition text-indigo-600 bg-indigo-50";
                } else {
                    navBtn.className = "flex flex-col items-center py-1 rounded-xl transition text-slate-500 hover:text-slate-900";
                }
            });
            renderApp();
        }

        // 時期（緊急度）の自動判定（未定は later）
        function getTimingStatus(dueDateStr) {
            if (!dueDateStr) return 'later';
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const dueDate = new Date(dueDateStr);
            dueDate.setHours(0, 0, 0, 0);

            const nextPayday = getNextPayday();
            nextPayday.setHours(0, 0, 0, 0);

            const diffDays = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays <= 3) {
                return 'urgent'; // 3日以内は「いそぎ」
            } else if (dueDate <= nextPayday) {
                return 'payday'; // 次の給料日までは「給料日まで」
            } else {
                return 'later';  // 給料日以降・未定は「まだ先」
            }
        }

        function getGenreColor(categoryName) {
            const found = customGenres.find(g => g.name === categoryName);
            return found ? found.color : '#ffffff';
        }

        function renderApp() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('itemsContainer');
            const emptyState = document.getElementById('emptyState');

            const filtered = items.filter(item => {
                if (currentGenreFilter === '⭐ 定番' && !item.favorite) return false;
                if (currentGenreFilter !== 'すべて' && currentGenreFilter !== '⭐ 定番' && item.category !== currentGenreFilter) return false;
                
                const timing = getTimingStatus(item.dueDate);
                if (currentTimingFilter !== 'all' && timing !== currentTimingFilter) return false;

                if (search && !item.title.toLowerCase().includes(search) && !(item.memo && item.memo.toLowerCase().includes(search)) && !(item.store && item.store.toLowerCase().includes(search))) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const badges = {
                urgent: '<span class="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">🔥 いそぎ</span>',
                payday: '<span class="bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">📅 給料日まで</span>',
                later: '<span class="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">⏳ まだ先</span>'
            };

            container.innerHTML = filtered.map(item => {
                const timing = getTimingStatus(item.dueDate);
                const dateVal = item.dueDate ? `${item.dueDate.replace(/-/g, '/')}` : '未定';
                const cardColor = getGenreColor(item.category);

                return `
                    <div onclick="openModal(${item.id})" class="rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group" style="background-color: ${cardColor};">
                        <div>
                            <div class="relative w-full h-36 bg-slate-200/40 flex items-center justify-center overflow-hidden">
                                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` : `<i class="fa-solid fa-box text-slate-300 text-3xl"></i>`}
                                ${item.favorite ? '<div class="absolute top-2 left-2 bg-amber-400 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow"><i class="fa-solid fa-star"></i></div>' : ''}
                                <div class="absolute bottom-2 right-2">${badges[timing]}</div>
                            </div>
                            <div class="p-3 space-y-1">
                                <div class="flex justify-between items-center text-[10px]">
                                    <span class="font-bold px-2 py-0.5 rounded-md bg-white/80 text-slate-800 shadow-xs border border-slate-100">${item.category}</span>
                                    <span class="text-slate-600 font-medium"><i class="fa-regular fa-clock mr-0.5"></i>${dateVal}</span>
                                </div>
                                <h3 class="font-bold text-sm text-slate-900 truncate pt-1">${item.title}</h3>
                                ${item.store ? `<p class="text-xs text-slate-600 truncate"><i class="fa-solid fa-store mr-1"></i>${item.store}</p>` : ''}
                            </div>
                        </div>
                        <div class="px-3 pb-3 flex justify-between items-center text-xs text-slate-600 border-t border-slate-900/5 pt-2 mt-1">
                            <span class="font-bold">${item.price ? `¥${item.price.toLocaleString()}` : '-'}</span>
                            <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="text-slate-400 hover:text-rose-500 p-1 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('itemImageBase64').value = base64;
                document.getElementById('imagePreview').src = base64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            EXIF.getData(file, function() {
                const dateTime = EXIF.getTag(this, "DateTimeOriginal");
                document.getElementById('exifInfo').innerHTML = dateTime ? `撮影日: ${dateTime}` : '';
            });
        }

        function setDueDatePending() {
            document.getElementById('itemDueDate').value = '';
            document.getElementById('dueDateNotice').innerText = '✔ 「未定」に設定しました';
        }

        function openModal(id = null) {
            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            form.reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('itemImageBase64').value = '';
            document.getElementById('dueDateNotice').innerText = '※未定にすると自動的に「⏳ まだ先」に分類されます';

            if (id) {
                document.getElementById('modalTitle').innerText = '必要品を編集';
                const item = items.find(i => i.id === id);
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemTitle').value = item.title;
                document.getElementById('itemDueDate').value = item.dueDate || '';
                document.getElementById('itemCategory').value = item.category;
                document.getElementById('itemStore').value = item.store || '';
                document.getElementById('itemPrice').value = item.price || '';
                document.getElementById('itemMemo').value = item.memo || '';
                document.getElementById('itemFavorite').checked = item.favorite || false;
                
                if (item.image) {
                    document.getElementById('itemImageBase64').value = item.image;
                    document.getElementById('imagePreview').src = item.image;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
            } else {
                document.getElementById('modalTitle').innerText = '必要品を追加';
                document.getElementById('itemId').value = '';
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                document.getElementById('itemDueDate').value = tomorrow.toISOString().slice(0,10);
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const newItem = {
                id: id ? Number(id) : Date.now(),
                title: document.getElementById('itemTitle').value,
                dueDate: document.getElementById('itemDueDate').value,
                category: document.getElementById('itemCategory').value,
                image: document.getElementById('itemImageBase64').value,
                store: document.getElementById('itemStore').value,
                price: document.getElementById('itemPrice').value ? Number(document.getElementById('itemPrice').value) : null,
                memo: document.getElementById('itemMemo').value,
                favorite: document.getElementById('itemFavorite').checked
            };

            if (id) {
                const index = items.findIndex(i => i.id === Number(id));
                items[index] = newItem;
            } else {
                items.unshift(newItem);
            }

            localStorage.setItem('stockmemo_items', JSON.stringify(items));
            closeModal();
            renderApp();
        }

        function deleteItem(id) {
            if (confirm('このアイテムを削除してもよろしいですか？')) {
                items = items.filter(i => i.id !== id);
                localStorage.setItem('stockmemo_items', JSON.stringify(items));
                renderApp();
            }
        }

        // --- ジャンル管理機能 ---
        function openGenreManageModal() {
            renderGenreManageList();
            document.getElementById('genreManageModal').classList.remove('hidden');
        }

        function closeGenreManageModal() {
            document.getElementById('genreManageModal').classList.add('hidden');
        }

        function renderGenreManageList() {
            const container = document.getElementById('genreListContainer');
            container.innerHTML = customGenres.map((g, index) => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-2xl">
                    <div class="flex items-center space-x-2 flex-1 mr-2">
                        <input type="color" value="${g.color}" onchange="updateGenreColor(${g.id}, this.value)" title="タップして背景色を変更">
                        <span class="text-sm font-bold text-slate-800">${g.name}</span>
                    </div>
                    ${customGenres.length > 1 ? `<button onclick="deleteGenre(${g.id})" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-xs" title="削除"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                </div>
            `).join('');
        }

        function addNewGenre(event) {
            event.preventDefault();
            const nameInput = document.getElementById('newGenreName');
            const colorInput = document.getElementById('newGenreColor');
            const name = nameInput.value.trim();
            if (!name) return;

            if (customGenres.some(g => g.name === name)) {
                alert('同じ名前のジャンルがすでに存在します');
                return;
            }

            customGenres.push({
                id: Date.now(),
                name: name,
                color: colorInput.value
            });

            localStorage.setItem('stockmemo_genres_v2', JSON.stringify(customGenres));
            nameInput.value = '';
            renderGenreManageList();
            renderGenreTabs();
            renderCategorySelect();
            renderApp();
        }

        function updateGenreColor(id, newColor) {
            const target = customGenres.find(g => g.id === id);
            if (target) {
                target.color = newColor;
                localStorage.setItem('stockmemo_genres_v2', JSON.stringify(customGenres));
                renderApp();
            }
        }

        function deleteGenre(id) {
            const target = customGenres.find(g => g.id === id);
            if (!target) return;

            if (confirm(`ジャンル「${target.name}」を削除してもよろしいですか？`)) {
                customGenres = customGenres.filter(g => g.id !== id);
                localStorage.setItem('stockmemo_genres_v2', JSON.stringify(customGenres));
                
                if (currentGenreFilter === target.name) {
                    currentGenreFilter = 'すべて';
                }
                
                renderGenreManageList();
                renderGenreTabs();
                renderCategorySelect();
                renderApp();
            }
        }

        init();
    </script>
</body>
</html>
