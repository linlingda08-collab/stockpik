<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reminders - 買い物・レシピ・ストックメモ</title>

    <!-- iPhone ホーム画面アイコン & アプリ設定 -->
    <link rel="apple-touch-icon" href="icon.PNG">
    <meta name="apple-mobile-web-app-title" content="Reminders">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 円形カラーピッカー */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #e2e8f0;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 selection:bg-indigo-100">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="icon.PNG" id="headerIcon" class="w-9 h-9 rounded-xl object-cover shadow-sm border border-slate-100" onerror="this.style.display='none'; document.getElementById('headerIconFallback').style.display='flex';">
                <div id="headerIconFallback" class="hidden bg-indigo-600 text-white w-9 h-9 rounded-xl items-center justify-center shadow-md">
                    <i class="fa-solid fa-list-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">Reminders</h1>
                    <p class="text-[10px] text-slate-400">買い物・レシピ・ストックメモ</p>
                </div>
            </div>

            <!-- ジャンル編集 ＆ 追加ボタン -->
            <div class="flex items-center space-x-2">
                <button onclick="openGenreManageModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1 border border-slate-200">
                    <i class="fa-solid fa-tags text-indigo-600"></i>
                    <span>ジャンル</span>
                </button>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-md transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span class="text-xs sm:text-sm">追加</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-4">

        <!-- カテゴリー詳細画面時の「戻るヘッダー」 -->
        <div id="categoryDetailHeader" class="hidden mb-4 flex items-center justify-between bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <button onclick="closeCategoryDetail()" class="text-indigo-600 font-bold text-sm flex items-center space-x-1 hover:text-indigo-800 transition">
                <i class="fa-solid fa-chevron-left text-xs"></i>
                <span>一覧に戻る</span>
            </button>
            <div class="flex items-center space-x-2">
                <span id="activeCategoryColorDot" class="w-3.5 h-3.5 rounded-full border border-slate-200"></span>
                <h2 id="activeCategoryTitle" class="font-bold text-slate-900 text-base"></h2>
            </div>
        </div>

        <!-- マイリスト（フォルダ）ビューエリア -->
        <div id="folderContainer" class="space-y-3">
            <!-- 動的生成 -->
        </div>

        <!-- カテゴリー詳細時：上下分割表示エリア -->
        <div id="categoryContentArea" class="hidden space-y-6">
            
            <!-- ① 買う物（リマインダー）セクション -->
            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center space-x-1">
                    <i class="fa-solid fa-basket-shopping text-indigo-600"></i>
                    <span>買う物（リマインダー）</span>
                </h3>
                <div id="reminderItemsContainer" class="space-y-2">
                    <!-- 動的生成 -->
                </div>
            </div>

            <!-- 完了した項目（履歴）セクション -->
            <div id="completedSection" class="hidden pt-2 space-y-2">
                <button onclick="toggleCompletedAccordion()" class="flex items-center space-x-2 text-xs font-bold text-slate-400 hover:text-slate-600 transition">
                    <i id="completedChevron" class="fa-solid fa-chevron-right text-[10px] transition-transform"></i>
                    <span>完了した項目 (<span id="completedCount">0</span>)</span>
                </button>
                <div id="completedContainer" class="hidden space-y-2">
                    <!-- 動的生成 -->
                </div>
            </div>

            <!-- ② メモ・製品記録（消えない）セクション -->
            <div class="space-y-2 pt-4 border-t border-slate-200/80">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center space-x-1">
                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                    <span>メモ・製品記録（消えない）</span>
                </h3>
                <div id="memoItemsContainer" class="space-y-2">
                    <!-- 動的生成 -->
                </div>
            </div>

        </div>

        <!-- 該当なし表示 -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-4xl mb-3">📭</div>
            <p class="text-slate-500 text-sm">該当するアイテムまたはカテゴリーがありません。<br>右上から追加してみましょう！</p>
        </div>
    </main>

    <!-- アイテム閲覧モーダル -->
    <div id="viewModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-xl p-5 sm:p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-900 text-base">詳細情報</h3>
                <button onclick="closeViewModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="viewModalContent" class="space-y-3">
                <!-- 動的生成 -->
            </div>

            <div class="flex justify-between items-center pt-3 border-t">
                <button type="button" onclick="deleteItemFromView()" class="px-4 py-2 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold hover:bg-rose-100 transition">削除する</button>
                <div class="space-x-2">
                    <button type="button" onclick="closeViewModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200 transition">閉じる</button>
                    <button type="button" onclick="switchToEditFromView()" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700 transition shadow-sm">編集する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- アイテム追加・編集モーダル -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-xl p-5 sm:p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modalTitle" class="text-lg font-bold text-slate-900">追加</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">

                <!-- 種別選択（買う物か、消えないメモか） -->
                <div class="bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 space-y-1.5">
                    <label class="block text-xs font-bold text-indigo-900">種別を選択 <span class="text-rose-500">*</span></label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center space-x-2 bg-white p-2.5 rounded-xl border border-indigo-200 cursor-pointer shadow-xs">
                            <input type="radio" name="itemType" value="reminder" checked class="text-indigo-600 focus:ring-indigo-500">
                            <div>
                                <span class="text-xs font-bold block text-slate-800">🛒 買う物</span>
                                <span class="text-[10px] text-slate-400 block">消せるリマインダー</span>
                            </div>
                        </label>
                        <label class="flex items-center space-x-2 bg-white p-2.5 rounded-xl border border-indigo-200 cursor-pointer shadow-xs">
                            <input type="radio" name="itemType" value="memo" class="text-indigo-600 focus:ring-indigo-500">
                            <div>
                                <span class="text-xs font-bold block text-slate-800">📖 メモ・記録</span>
                                <span class="text-[10px] text-slate-400 block">消えない保存用</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 写真を選択 -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-slate-700">
                            <i class="fa-solid fa-camera text-indigo-600 mr-1"></i> 写真（任意）
                        </label>
                        <button type="button" onclick="removeImageInEdit()" class="text-[11px] text-rose-500 font-bold hover:underline">写真を削除</button>
                    </div>
                    <input type="file" id="itemImageFile" accept="image/*" onchange="handleImagePreview(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    <input type="hidden" id="itemImageBase64">
                    
                    <div id="imagePreviewContainer" class="mt-2 hidden flex items-center space-x-3">
                        <img id="imagePreview" class="w-16 h-16 object-cover rounded-xl border border-slate-200 shadow-sm shrink-0">
                    </div>
                </div>

                <!-- 詳細入力 -->
                <div class="space-y-3 pt-1">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">タイトル（品名・製品名など） <span class="text-rose-500">*</span></label>
                        <input type="text" id="itemTitle" required placeholder="例: 絆創膏 ケアリーヴ" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">参考URL（Instagram / TikTok / 製品サイト等）</label>
                        <input type="url" id="itemUrl" placeholder="https://..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ジャンル <span class="text-rose-500">*</span></label>
                            <select id="itemCategory" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- 動的生成 -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">購入先・店舗</label>
                            <input type="text" id="itemStore" placeholder="例: 薬局" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <!-- フラグ指定（急ぎ・定番） -->
                    <div class="flex items-center space-x-4 pt-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="itemUrgent" class="w-4 h-4 text-rose-600 border-slate-300 rounded focus:ring-rose-500">
                            <span class="text-xs font-bold text-rose-600 flex items-center"><i class="fa-solid fa-fire mr-1"></i>🔥 急ぎ（最上位）</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="itemFavorite" class="w-4 h-4 text-amber-500 border-slate-300 rounded focus:ring-amber-500">
                            <span class="text-xs font-semibold text-slate-700">⭐ 定番品</span>
                        </label>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                        <textarea id="itemMemo" rows="2" placeholder="型番や製品の特徴など" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ジャンル管理モーダル -->
    <div id="genreManageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-5 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-tags text-indigo-600 mr-1.5"></i>ジャンル編集・追加</h3>
                <button onclick="closeGenreManageModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="addNewGenre(event)" class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-3 shrink-0">
                <span class="text-xs font-bold text-slate-700 block">＋ 新しいジャンルを作成</span>
                <div class="flex items-center space-x-2">
                    <input type="color" id="newGenreColor" value="#e0e7ff" title="タップして好きな色を選択">
                    <input type="text" id="newGenreName" required placeholder="ジャンル名（例: 買い物（薬局））" class="flex-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="px-3.5 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shrink-0 shadow-sm">追加</button>
                </div>
            </form>

            <div class="overflow-y-auto flex-1 space-y-2 pr-1" id="genreListContainer">
                <!-- 動的生成 -->
            </div>

            <div class="flex justify-end pt-2 border-t">
                <button type="button" onclick="closeGenreManageModal()" class="px-5 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">完了</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        let customGenres = JSON.parse(localStorage.getItem('reminders_genres')) || [];
        let items = JSON.parse(localStorage.getItem('reminders_items')) || [];

        let selectedCategoryDetail = null; 
        let pendingTimeouts = {}; 
        let showCompletedAccordion = false;
        let viewingItemId = null;

        function init() {
            renderCategorySelect();
            renderApp();
        }

        function openCategoryDetail(genreName) {
            selectedCategoryDetail = genreName;
            document.getElementById('categoryDetailHeader').classList.remove('hidden');
            document.getElementById('activeCategoryTitle').innerText = genreName;
            document.getElementById('activeCategoryColorDot').style.backgroundColor = getGenreColor(genreName);
            renderApp();
        }

        function closeCategoryDetail() {
            selectedCategoryDetail = null;
            document.getElementById('categoryDetailHeader').classList.add('hidden');
            renderApp();
        }

        function renderCategorySelect() {
            const select = document.getElementById('itemCategory');
            if (customGenres.length === 0) {
                select.innerHTML = '<option value="">(ジャンルを先に作成してください)</option>';
            } else {
                select.innerHTML = customGenres.map(g => `<option value="${g.name}">${g.name}</option>`).join('');
            }
        }

        function getGenreColor(categoryName) {
            const found = customGenres.find(g => g.name === categoryName);
            return found ? found.color : '#ffffff';
        }

        function toggleCheckItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (item.pendingComplete) {
                clearTimeout(pendingTimeouts[id]);
                delete pendingTimeouts[id];
                item.pendingComplete = false;
                renderApp();
            } else {
                item.pendingComplete = true;
                renderApp();

                pendingTimeouts[id] = setTimeout(() => {
                    item.pendingComplete = false;
                    item.completed = true; 
                    delete pendingTimeouts[id];
                    localStorage.setItem('reminders_items', JSON.stringify(items));
                    renderApp();
                }, 5000);
            }
        }

        function restoreItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.completed = false;
                item.pendingComplete = false;
                localStorage.setItem('reminders_items', JSON.stringify(items));
                renderApp();
            }
        }

        function toggleCompletedAccordion() {
            showCompletedAccordion = !showCompletedAccordion;
            const container = document.getElementById('completedContainer');
            const chevron = document.getElementById('completedChevron');
            if (showCompletedAccordion) {
                container.classList.remove('hidden');
                chevron.classList.add('rotate-90');
            } else {
                container.classList.add('hidden');
                chevron.classList.remove('rotate-90');
            }
        }

        function openViewModal(id) {
            viewingItemId = id;
            const item = items.find(i => i.id === id);
            if (!item) return;

            const typeLabel = item.type === 'memo' ? '<span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded">📖 メモ・記録</span>' : '<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded">🛒 買う物</span>';

            const content = document.getElementById('viewModalContent');
            content.innerHTML = `
                ${item.image ? `<div class="w-full h-48 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200"><img src="${item.image}" class="w-full h-full object-cover"></div>` : ''}
                <div>
                    <div class="flex items-center space-x-2 mb-1">
                        ${typeLabel}
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${item.category}</span>
                        ${item.urgent ? '<span class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">🔥 急ぎ</span>' : ''}
                        ${item.favorite ? '<span class="text-amber-500 font-bold text-xs"><i class="fa-solid fa-star"></i> 定番</span>' : ''}
                    </div>
                    <h2 class="text-lg font-bold text-slate-900">${item.title}</h2>
                </div>
                ${item.url ? `<div><p class="text-xs font-semibold text-slate-400 mb-0.5">参考URL</p><a href="${item.url}" target="_blank" class="text-xs text-indigo-600 hover:underline break-all block"><i class="fa-solid fa-link mr-1"></i>${item.url}</a></div>` : ''}
                ${item.store ? `<div><p class="text-xs font-semibold text-slate-400 mb-0.5">購入先・店舗</p><p class="text-xs text-slate-700"><i class="fa-solid fa-store mr-1"></i>${item.store}</p></div>` : ''}
                ${item.memo ? `<div><p class="text-xs font-semibold text-slate-400 mb-0.5">メモ</p><p class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200 whitespace-pre-wrap">${item.memo}</p></div>` : ''}
            `;

            document.getElementById('viewModal').classList.remove('hidden');
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
            viewingItemId = null;
        }

        function switchToEditFromView() {
            const id = viewingItemId;
            closeViewModal();
            openModal(id);
        }

        function deleteItemFromView() {
            if (confirm('このアイテムを削除してもよろしいですか？')) {
                items = items.filter(i => i.id !== viewingItemId);
                localStorage.setItem('reminders_items', JSON.stringify(items));
                closeViewModal();
                renderApp();
            }
        }

        function renderApp() {
            const folderContainer = document.getElementById('folderContainer');
            const categoryContentArea = document.getElementById('categoryContentArea');
            const reminderItemsContainer = document.getElementById('reminderItemsContainer');
            const memoItemsContainer = document.getElementById('memoItemsContainer');
            const completedSection = document.getElementById('completedSection');
            const completedContainer = document.getElementById('completedContainer');
            const completedCount = document.getElementById('completedCount');
            const emptyState = document.getElementById('emptyState');

            if (!selectedCategoryDetail) {
                categoryContentArea.classList.add('hidden');
                folderContainer.classList.remove('hidden');

                if (customGenres.length === 0) {
                    folderContainer.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                folderContainer.innerHTML = customGenres.map(genre => {
                    const genreActiveItems = items.filter(i => i.category === genre.name && !i.completed);
                    const count = genreActiveItems.length;

                    return `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div onclick="openCategoryDetail('${genre.name}')" class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition" style="border-left: 6px solid ${genre.color};">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-slate-700 font-bold" style="background-color: ${genre.color};">
                                        <i class="fa-solid fa-list-check text-xs"></i>
                                    </div>
                                    <span class="font-bold text-sm text-slate-800">${genre.name}</span>
                                </div>
                                <div class="flex items-center space-x-2 text-slate-400 text-xs font-bold">
                                    <span>${count}</span>
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } else {
                folderContainer.classList.add('hidden');
                categoryContentArea.classList.remove('hidden');

                let categoryItems = items.filter(i => i.category === selectedCategoryDetail);

                // 1. 買う物（未完了 ＆ 完了）
                let remindersActive = categoryItems.filter(i => i.type !== 'memo' && !i.completed);
                let remindersCompleted = categoryItems.filter(i => i.type !== 'memo' && i.completed);

                remindersActive.sort((a, b) => {
                    if (a.urgent && !b.urgent) return -1;
                    if (!a.urgent && b.urgent) return 1;
                    return 0;
                });

                // 2. メモ・記録（消えない）
                let memos = categoryItems.filter(i => i.type === 'memo');

                if (categoryItems.length === 0) {
                    emptyState.classList.remove('hidden');
                    reminderItemsContainer.innerHTML = '<p class="text-xs text-slate-400 py-2">アイテムがありません</p>';
                    memoItemsContainer.innerHTML = '<p class="text-xs text-slate-400 py-2">メモがありません</p>';
                    completedSection.classList.add('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                // 買う物リスト描画
                if (remindersActive.length === 0) {
                    reminderItemsContainer.innerHTML = '<p class="text-xs text-slate-400 py-2">買う物はありません</p>';
                } else {
                    reminderItemsContainer.innerHTML = remindersActive.map(item => {
                        const cardColor = getGenreColor(item.category);
                        const urgentStyle = item.urgent ? 'border-2 border-rose-500 shadow-sm' : 'border border-slate-200/80';
                        const isPending = item.pendingComplete;

                        return `
                            <div onclick="openViewModal(${item.id})" class="p-3 rounded-2xl ${urgentStyle} shadow-xs hover:shadow-md transition cursor-pointer flex items-center justify-between ${isPending ? 'opacity-50' : ''}" style="background-color: ${cardColor};">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <button onclick="event.stopPropagation(); toggleCheckItem(${item.id})" class="w-6 h-6 rounded-full ${isPending ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-slate-400 border-slate-300'} flex items-center justify-center shrink-0 border shadow-xs transition" title="${isPending ? '取り消す' : '完了'}">
                                        <i class="fa-solid ${isPending ? 'fa-check text-xs' : 'fa-circle text-xs'}"></i>
                                    </button>

                                    ${item.image ? `<img src="${item.image}" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-slate-200">` : ''}
                                    
                                    <div class="truncate">
                                        <div class="flex items-center space-x-1.5">
                                            <span class="font-bold text-xs text-slate-800 truncate ${isPending ? 'line-through' : ''}">${item.title}</span>
                                            ${item.urgent ? '<span class="bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full">🔥 急ぎ</span>' : ''}
                                            ${item.favorite ? '<i class="fa-solid fa-star text-amber-400 text-[10px]"></i>' : ''}
                                        </div>
                                        ${item.url ? `<a href="${item.url}" target="_blank" onclick="event.stopPropagation();" class="text-[11px] text-indigo-600 hover:underline truncate block pt-0.5"><i class="fa-solid fa-link mr-1"></i>${item.url}</a>` : ''}
                                        <div class="flex items-center space-x-2 text-[10px] text-slate-500 pt-0.5">
                                            ${item.store ? `<span><i class="fa-solid fa-store mr-0.5"></i>${item.store}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-xs" title="削除"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 履歴描画
                if (remindersCompleted.length > 0) {
                    completedSection.classList.remove('hidden');
                    completedCount.innerText = remindersCompleted.length;

                    completedContainer.innerHTML = remindersCompleted.map(item => `
                        <div onclick="restoreItem(${item.id})" class="p-2.5 rounded-xl border border-slate-200 bg-slate-100/70 flex items-center justify-between cursor-pointer hover:bg-slate-200/60 transition opacity-60">
                            <div class="flex items-center space-x-3 overflow-hidden">
                                <div class="w-5 h-5 rounded-full bg-slate-400 text-white flex items-center justify-center shrink-0 text-xs">
                                    <i class="fa-solid fa-check"></i>
                                </div>
                                <span class="text-xs font-bold text-slate-600 line-through truncate">${item.title}</span>
                            </div>
                            <div class="flex items-center space-x-2 shrink-0 text-[10px] text-slate-400">
                                <span>タップで復活</span>
                                <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="text-slate-400 hover:text-rose-500 p-1 transition"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    completedSection.classList.add('hidden');
                }

                // メモ・記録リスト描画（消えない）
                if (memos.length === 0) {
                    memoItemsContainer.innerHTML = '<p class="text-xs text-slate-400 py-2">メモはありません</p>';
                } else {
                    memoItemsContainer.innerHTML = memos.map(item => {
                        const cardColor = getGenreColor(item.category);

                        return `
                            <div onclick="openViewModal(${item.id})" class="p-3 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition cursor-pointer flex items-center justify-between" style="background-color: ${cardColor};">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <div class="w-6 h-6 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 border border-indigo-200 text-xs shadow-xs">
                                        <i class="fa-solid fa-book-open"></i>
                                    </div>

                                    ${item.image ? `<img src="${item.image}" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-slate-200">` : ''}
                                    
                                    <div class="truncate">
                                        <div class="flex items-center space-x-1.5">
                                            <span class="font-bold text-xs text-slate-800 truncate">${item.title}</span>
                                            ${item.favorite ? '<i class="fa-solid fa-star text-amber-400 text-[10px]"></i>' : ''}
                                        </div>
                                        ${item.url ? `<a href="${item.url}" target="_blank" onclick="event.stopPropagation();" class="text-[11px] text-indigo-600 hover:underline truncate block pt-0.5"><i class="fa-solid fa-link mr-1"></i>${item.url}</a>` : ''}
                                        ${item.memo ? `<p class="text-[11px] text-slate-500 truncate pt-0.5">${item.memo}</p>` : ''}
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-xs" title="削除"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }
        }

        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    document.getElementById('itemImageBase64').value = compressedBase64;
                    document.getElementById('imagePreview').src = compressedBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeImageInEdit() {
            document.getElementById('itemImageBase64').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('itemImageFile').value = '';
        }

        function openModal(id = null) {
            if (customGenres.length === 0) {
                alert('先にジャンルを作成してください（右上「ジャンル」ボタンより）');
                openGenreManageModal();
                return;
            }

            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            form.reset();
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('itemImageBase64').value = '';

            if (id) {
                document.getElementById('modalTitle').innerText = '編集';
                const item = items.find(i => i.id === id);
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemTitle').value = item.title;
                document.getElementById('itemUrl').value = item.url || '';
                document.getElementById('itemCategory').value = item.category;
                document.getElementById('itemStore').value = item.store || '';
                document.getElementById('itemMemo').value = item.memo || '';
                document.getElementById('itemUrgent').checked = item.urgent || false;
                document.getElementById('itemFavorite').checked = item.favorite || false;
                
                const typeVal = item.type || 'reminder';
                document.querySelector(`input[name="itemType"][value="${typeVal}"]`).checked = true;
                
                if (item.image) {
                    document.getElementById('itemImageBase64').value = item.image;
                    document.getElementById('imagePreview').src = item.image;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }
            } else {
                document.getElementById('modalTitle').innerText = '追加';
                document.getElementById('itemId').value = '';
                if (selectedCategoryDetail) {
                    document.getElementById('itemCategory').value = selectedCategoryDetail;
                }
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const typeVal = document.querySelector('input[name="itemType"]:checked').value;

            const newItem = {
                id: id ? Number(id) : Date.now(),
                type: typeVal,
                title: document.getElementById('itemTitle').value,
                url: document.getElementById('itemUrl').value,
                category: document.getElementById('itemCategory').value,
                image: document.getElementById('itemImageBase64').value,
                store: document.getElementById('itemStore').value,
                memo: document.getElementById('itemMemo').value,
                urgent: document.getElementById('itemUrgent').checked,
                favorite: document.getElementById('itemFavorite').checked,
                completed: false,
                pendingComplete: false
            };

            if (id) {
                const index = items.findIndex(i => i.id === Number(id));
                items[index] = { ...items[index], ...newItem };
            } else {
                items.unshift(newItem);
            }

            localStorage.setItem('reminders_items', JSON.stringify(items));
            closeModal();
            renderApp();
        }

        function deleteItem(id) {
            if (confirm('このアイテムを削除してもよろしいですか？')) {
                items = items.filter(i => i.id !== id);
                localStorage.setItem('reminders_items', JSON.stringify(items));
                renderApp();
            }
        }

        function openGenreManageModal() {
            renderGenreManageList();
            document.getElementById('genreManageModal').classList.remove('hidden');
        }

        function closeGenreManageModal() {
            document.getElementById('genreManageModal').classList.add('hidden');
        }

        function renderGenreManageList() {
            const container = document.getElementById('genreListContainer');
            if (customGenres.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">登録中のジャンルはありません</p>';
                return;
            }

            container.innerHTML = customGenres.map((g) => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-2xl">
                    <div class="flex items-center space-x-2 flex-1 mr-2">
                        <input type="color" value="${g.color}" onchange="updateGenreColor(${g.id}, this.value)" title="タップして背景色を変更">
                        <span class="text-sm font-bold text-slate-800">${g.name}</span>
                    </div>
                    <button onclick="deleteGenre(${g.id})" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-xs" title="削除"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        function addNewGenre(event) {
            event.preventDefault();
            const nameInput = document.getElementById('newGenreName');
            const colorInput = document.getElementById('newGenreColor');
            const name = nameInput.value.trim();
            if (!name) return;

            if (customGenres.some(g => g.name === name)) {
                alert('同じ名前のジャンルがすでに存在します');
                return;
            }

            customGenres.push({
                id: Date.now(),
                name: name,
                color: colorInput.value
            });

            localStorage.setItem('reminders_genres', JSON.stringify(customGenres));
            nameInput.value = '';
            renderGenreManageList();
            renderCategorySelect();
            closeGenreManageModal();
            renderApp();
        }

        function updateGenreColor(id, newColor) {
            const target = customGenres.find(g => g.id === id);
            if (target) {
                target.color = newColor;
                localStorage.setItem('reminders_genres', JSON.stringify(customGenres));
                renderApp();
            }
        }

        function deleteGenre(id) {
            const target = customGenres.find(g => g.id === id);
            if (!target) return;

            if (confirm(`ジャンル「${target.name}」を削除してもよろしいですか？`)) {
                customGenres = customGenres.filter(g => g.id !== id);
                localStorage.setItem('reminders_genres', JSON.stringify(customGenres));
                
                renderGenreManageList();
                renderCategorySelect();
                renderApp();
            }
        }

        init();
    </script>
</body>
</html>
